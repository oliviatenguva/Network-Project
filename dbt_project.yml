name: 'package_health'
version: '1.0.0'
profile: 'package_health'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
log-path: "logs"          # dbt's own log lands in logs/dbt.log (gitignored)

clean-targets:
  - "target"
  - "dbt_packages"

# Staging models are thin views over the raw tables; facts and marts are
# tables, so Tasks 4-6 read precomputed results instead of re-running SQL.
models:
  package_health:
    staging:
      +materialized: view
    marts:
      +materialized: table
