package_health:
  target: dev
  outputs:
    dev:
      type: duckdb
      # main.py sets DBT_DUCKDB_PATH to an absolute path, so dbt finds the
      # database no matter which folder the flow is started from.
      path: "{{ env_var('DBT_DUCKDB_PATH', 'packages.duckdb') }}"
      threads: 1
      settings:
        TimeZone: UTC   # GitHub timestamps are UTC; date_trunc('month', ...) must use UTC too
